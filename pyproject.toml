[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fontlens"
version = "0.1.0"
description = "Web Font Bloat Optimizer, Glyph Subset Synthesizer & Zero-CLS Metric Overrides"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Alexandr Motologa", email = "alexandr@mtlg.site" }
]
keywords = [
  "web-performance",
  "core-web-vitals",
  "typography",
  "woff2",
  "opentype",
  "truetype",
  "glyph-subsetting",
  "layout-shift-prevention",
  "zero-cls",
  "fonttools"
]
dependencies = [
  "fonttools[unicode,woff]>=4.40.0",
  "brotli>=1.1.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "python-multipart>=0.0.9",
  "rich>=13.7.0",
  "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]

[project.scripts]
fontlens = "fontlens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fontlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
